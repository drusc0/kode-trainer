# Shared by backend/, runner/ and scripts/ (see backend/TOOLING.md).
line-length = 120
target-version = "py312"
# First-party roots for import sorting: `app` (backend) and the runner modules scripts import.
src = ["backend", "runner"]
# Pattern guides are prose; their code samples are formatted by hand.
extend-exclude = ["*.md"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# The formatter owns line length; problem statements legitimately use ×, ≤, – etc.
ignore = ["E501", "RUF001"]

[lint.per-file-ignores]
# Starter code keeps indented blank lines so the editor cursor lands inside each method.
"backend/app/catalog/*" = ["W293"]
