[project]
name = "kodetrain-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "motor>=3.6,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
# The formatter owns line length; problem statements legitimately use ×, ≤, – etc.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Starter code keeps indented blank lines so the editor cursor lands inside each method.
"app/catalog/*" = ["W293"]

[tool.mypy]
strict = true
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
