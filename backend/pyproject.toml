[project]
name = "kodetrain-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2,<1",
    "uvicorn[standard]>=0.30,<1",
    "motor>=3.6,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "anthropic>=1.8,<2",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.uv]
package = false

[tool.mypy]
strict = true
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
